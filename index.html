<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="Homem e a Máquina"
  >

  <title>Homem e a Máquina</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main id="app" class="app">

    <!-- =====================================================
         TELA 01 — SPLASH
         ===================================================== -->

    <section
      id="screen-splash"
      class="screen screen-splash"
      aria-label="Homem e a Máquina"
    >

      <div class="splash-content">

        <div
          class="hm-logo hm-logo-3d"
          aria-label="HM"
        >
          <span class="hm-letter hm-h">H</span>
          <span class="hm-letter hm-m">M</span>
          <span class="hm-core"></span>
        </div>

        <h1 class="splash-title">
          Homem e a Máquina
        </h1>

        <p class="splash-concept">
          Onde o humano desperta a Máquina.
        </p>

        <div
          class="splash-loader"
          aria-label="A carregar"
          role="status"
        >
          <span class="loader-ring"></span>
        </div>

      </div>

    </section>

  </main>

  <script>
    window.setTimeout(function () {
      window.location.href = "terms.html";
    }, 4000);
  </script>

</body>
  </html>
